<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Skin Details</h1>
        <button onclick="goBack()">🔙 Back</button>
    </header>

    <div id="productDetails" class="details"></div>

    <script>
        function goBack() {
            window.history.back();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const skinId = urlParams.get('id');

        fetch("skins.json") 
            .then(response => response.json())
            .then(data => {
                let skin = data.skins.find(item => item.id == skinId);
                if (skin) {
                    let detailsDiv = document.getElementById("productDetails");
                    detailsDiv.innerHTML = `
                        <div class="product-container">
                            <h2 class="product-name">${skin.title}</h2>
                            <img src="${skin.image}" alt="${skin.title}" class="skin-image">
                            <p><strong>Category:</strong> ${skin.category ? skin.category : 'N/A'}</p>
                            <p><strong>Price:</strong> ₹${skin.price}</p>
                            <p><strong>Description:</strong> ${skin.description ? skin.description : 'No description available'}</p>
                        </div>
                    `;
                } else {
                    document.getElementById("productDetails").innerHTML = "<p>Skin not found.</p>";
                }
            })
            .catch(error => console.error("Error loading skin details:", error));
    </script>
</body>
</html>
